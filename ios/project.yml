# Practice, Joe's guitar practice iPhone app. XcodeGen turns this into Practice.xcodeproj on the macOS runner
# (.github/workflows/ios-build.yml); there is no Mac here and no project file in the repo.
#
# Signing is Blocks' setup (the same Apple team and Apple Distribution certificate as the HQ and Browser apps) with
# Practice's own ad-hoc profile, named exactly "Practice AdHoc" (scripts/apple-provision.mjs).
name: Practice
options:
  bundleIdPrefix: com.caulfieldengineering
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Practice:
    type: application
    platform: iOS
    sources:
      - path: Practice
      # The drill catalog's starter set, the same folder the drill server serves (catalog/), as a folder.
      - path: ../catalog
        type: folder
        buildPhase: resources
      # The recorded voice (scripts/make-voice.mjs), the same folder the drill server serves, as a folder.
      - path: ../voice
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.practice
        PRODUCT_NAME: Practice
        INFOPLIST_FILE: Practice/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: APPLE_TEAM_ID_REDACTED
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Practice AdHoc
  PracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PracticeTests
    dependencies:
      - target: Practice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.practice.tests
        CODE_SIGNING_ALLOWED: NO
  PracticeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PracticeUITests
    dependencies:
      - target: Practice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.practice.uitests
        TEST_TARGET_NAME: Practice
        CODE_SIGNING_ALLOWED: NO
schemes:
  Practice:
    build:
      targets:
        Practice: all
        PracticeTests: [test]
        PracticeUITests: [test]
    test:
      config: Debug
      targets:
        - PracticeTests
        - PracticeUITests
    archive:
      config: Release
